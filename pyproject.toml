[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "seclog-analyzer"
version = "0.1.0"
description = "Analisador de logs de segurança (SSH e web) com detecção de ataques e mapeamento MITRE ATT&CK"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

[project.scripts]
seclog = "seclog.cli:main"

[tool.setuptools]
packages = ["seclog"]
